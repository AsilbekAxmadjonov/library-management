services:

  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library-system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"          # host:container — access from your machine
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persist data between restarts
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library-system"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot Application ──────────────────────────────────────
  app:
    build:
      context: .             # look for Dockerfile in current directory
      dockerfile: Dockerfile
    container_name: library-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Override application.yml values with environment variables
      # Spring Boot automatically maps SPRING_DATASOURCE_URL → spring.datasource.url
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/library-system
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_LIQUIBASE_ENABLED: true

      # Business config — override defaults from application.yml if needed
      LIBRARY_LOAN_DEFAULT_LOAN_DAYS: 14
      LIBRARY_LOAN_EXTENSION_DAYS: 7
      LIBRARY_MEMBER_TYPES_STANDARD_DAILY_RATE: 500
      LIBRARY_MEMBER_TYPES_STUDENT_DAILY_RATE: 250
      LIBRARY_MEMBER_TYPES_PREMIUM_DAILY_RATE: 750
      LIBRARY_SCHEDULER_FINE_UPDATE_CRON: "0 0 1 * * *"

      # JVM timezone
      TZ: Asia/Tashkent
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Tashkent"
    depends_on:
      postgres:
        condition: service_healthy   # wait until postgres is ready
    networks:
      - library-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── pgAdmin — PostgreSQL GUI (optional, useful for development) ──
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: library-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@library.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"            # access pgAdmin at http://localhost:5050
    depends_on:
      - postgres
    networks:
      - library-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

# ── Named volumes — data persists even if containers are removed ──
volumes:
  postgres_data:
  pgadmin_data:

# ── Network — containers talk to each other by service name ───────
networks:
  library-network:
    driver: bridge